# ============================================================================
# Atheer DES Configuration — Actual simulation parameters
# ============================================================================
# These are the EXACT parameters used to produce the published results
# (Tables III-IV, Figures 6-7 in the paper).
#
# NOTE: Table II in the paper presents simplified/rounded values for
# readability (e.g., "400 ms" and "10%"). The values below are the
# precise parameters fed into the simulation engine. Running this
# config with `python atheer_sim.py` reproduces the published numbers.
# ============================================================================

meta:
  paper: "DTISD 2026"
  section: "VI"
  notes: "Network-only: same bank capacity across scenarios to isolate network effect."

experiment:
  load_points_tps: [5, 25, 50, 100, 250, 500]
  warmup_s: 5
  measure_s: 60
  num_runs: 10
  base_seed: 20260211

bank:
  capacity: 50
  service_time_s: 0.030
  local_time_s: 0.05

scenarios:
  - key: "S1_PUBLIC"
    name: "S1: Public Internet"
    network:
      latency_mean_s: 0.200
      latency_std_s: 0.120
      packet_loss: 0.05
      retries: 2
    timeouts:
      queue_timeout_s: 12.0
      e2e_timeout_s: 15.0
    degradation:
      enabled: true
      threshold_tps: 25.0
      latency_alpha: 0.75
      loss_alpha: 1.5
      max_loss: 0.45
    switch:
      redis_mean_s: 0.002
      redis_std_s: 0.0005
      postgres_mean_s: 0.005
      postgres_std_s: 0.001

  - key: "S2_PRIVATE"
    name: "S2: Private APN (Atheer)"
    network:
      latency_mean_s: 0.065
      latency_std_s: 0.015
      packet_loss: 0.001
      retries: 1
    timeouts:
      queue_timeout_s: 4.0
      e2e_timeout_s: 5.0
    degradation:
      enabled: false
    switch:
      redis_mean_s: 0.002
      redis_std_s: 0.0005
      postgres_mean_s: 0.005
      postgres_std_s: 0.001
